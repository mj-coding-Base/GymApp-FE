services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymapp-fe
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:${PORT:-3002}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3002}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
