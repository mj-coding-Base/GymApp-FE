# netlify.toml

[build]
  command = "yarn install --immutable && yarn build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://gymapp-khetech.netlify.app/" 

[dev]
  command = "yarn dev"
  port = 3000
  publish = "public"

[context.production.environment]
  ENVIRONMENT = "production"

[context.deploy-preview]
  environment = "preview"

[context.branch-deploy]
  environment = "staging"